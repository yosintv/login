<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Admin Login</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f6f8fa; }
        .login-card { background: white; padding: 2rem; border-radius: 6px; border: 1px solid #d0d7de; box-shadow: 0 8px 24px rgba(140,149,159,0.2); width: 300px; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; color: #24292f; }
        input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #0969da; box-shadow: 0 0 0 3px rgba(9,105,218,0.3); }
        button { width: 100%; padding: 0.5rem; background-color: #2da44e; color: white; border: 1px solid rgba(27,31,36,0.15); border-radius: 6px; font-weight: 600; cursor: pointer; }
        button:hover { background-color: #2c974b; }
        #error-msg { color: #cf222e; font-size: 0.85rem; margin-top: 1rem; text-align: center; min-height: 1.2rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Blog Admin</h1>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
        <button id="login-btn">Login</button>
        <div id="error-msg"></div>
    </div>

    <script>
        const loginBtn = document.getElementById('login-btn');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-msg');

        async function handleLogin() {
            const password = passwordInput.value;
            if (!password) return;
            
            errorMsg.textContent = "Verifying...";
            try {
                // We test the password by attempting to list files from the API
                const res = await fetch(`/api/github?action=list&password=${encodeURIComponent(password)}`);
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('blog_admin_password', password);
                    alert("Login Successful!");
                    // window.location.href = '/dashboard.html'; 
                } else {
                    errorMsg.textContent = data.error || "Authentication failed";
                }
            } catch (e) {
                errorMsg.textContent = "Server error. Check if API is running.";
            }
        }
        loginBtn.addEventListener('click', handleLogin);
        passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
    </script>
</body>
</html>
